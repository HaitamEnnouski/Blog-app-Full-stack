<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Blog App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.0/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="row justify-content-center text-center">
        <div class="col-lg-8">
          <h1 class="display-5 fw-bold mb-2">
            <i class="bi bi-journal-text me-3"></i>Blog App
          </h1>
          <p class="text-muted">Simple blog management</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container-fluid px-4">
    <div class="row">
      
      <!-- Sidebar -->
      <div class="col-lg-3">
        <!-- Stats Card -->
        <div class="card mb-4">
          <div class="card-body">
            <h6 class="card-title mb-3">
              <i class="bi bi-graph-up me-2"></i>Statistics
            </h6>
            <div class="row text-center">
              <div class="col-6">
                <div class="stat-item">
                  <h4 class="mb-1" id="total-posts">0</h4>
                  <small class="text-muted">Posts</small>
                </div>
              </div>
              <div class="col-6">
                <div class="stat-item">
                  <h4 class="mb-1" id="total-authors">0</h4>
                  <small class="text-muted">Authors</small>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">
        
        <!-- Content Header -->
        <div class="card mb-4">
          <div class="card-body">
            <div class="row align-items-center">
              <div class="col-md-6">
                <h5 class="card-title mb-0">
                  <i class="bi bi-collection me-2"></i>All Posts
                  <span class="badge bg-secondary ms-2" id="posts-count">0</span>
                </h5>
              </div>
              <div class="col-md-6">
                <div class="d-flex justify-content-md-end mt-3 mt-md-0">
                  <!-- Search Bar -->
                  <div class="input-group me-3" style="max-width: 250px;">
                    <input type="text" class="form-control form-control-sm" 
                           id="search-input" placeholder="Search posts...">
                    <button class="btn btn-outline-secondary btn-sm" type="button" id="search-btn">
                      <i class="bi bi-search"></i>
                    </button>
                  </div>
                  
                  <!-- View Toggle -->
                  <div class="btn-group" role="group">
                    <button type="button" class="btn btn-outline-secondary btn-sm active" 
                            data-view="grid" id="grid-view">
                      <i class="bi bi-grid-3x3-gap"></i>
                    </button>
                    <button type="button" class="btn btn-outline-secondary btn-sm" 
                            data-view="list" id="list-view">
                      <i class="bi bi-list"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Posts Container -->
        <div id="posts-container">
          <div class="text-center py-5">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3 text-muted">Loading posts...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Floating Action Button -->
  <button class="fab" id="create-post-btn" data-bs-toggle="modal" data-bs-target="#postModal">
    <i class="bi bi-plus-lg"></i>
  </button>

  <!-- Post Modal -->
  <div class="modal fade" id="postModal" tabindex="-1" aria-labelledby="postModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="postModalLabel">
            <i class="bi bi-plus-circle me-2"></i>Create Post
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <!-- Success/Error Messages -->
          <div id="modal-success-alert" class="alert alert-success d-none" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span id="modal-success-message"></span>
          </div>
          <div id="modal-error-alert" class="alert alert-danger d-none" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span id="modal-error-message"></span>
          </div>

          <!-- Post Form -->
          <form id="post-form">
            <input type="hidden" id="post-id">
            
            <div class="mb-3">
              <label for="title" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" placeholder="Enter post title..." required>
            </div>
            
            <div class="mb-3">
              <label for="content" class="form-label">Content</label>
              <textarea class="form-control" id="content" rows="6" placeholder="Write your content here..." required></textarea>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="author" class="form-label">Author</label>
                  <input type="text" class="form-control" id="author" placeholder="Author name" required>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="tags" class="form-label">Tags</label>
                  <input type="text" class="form-control" id="tags" placeholder="tag1, tag2, tag3" required>
                  <div class="form-text">Separate tags with commas</div>
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="save-post-btn">
            <span id="save-btn-text">
              <i class="bi bi-plus-lg me-1"></i>Create Post
            </span>
            <span class="d-none" id="save-btn-loader">
              <span class="spinner-border spinner-border-sm me-2"></span>
              Saving...
            </span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
